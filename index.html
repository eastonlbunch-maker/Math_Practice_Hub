<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --sidebar-bg: #111111;
            --accent-orange: #ff6600;
            --accent-hover: #cc5200;
            --text-main: #ffffff;
            --text-muted: #888888;
            --grid-line: rgba(255, 102, 0, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; display: flex; overflow: hidden; position: relative; }
        .checkered-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: 32px 32px; background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); pointer-events: none; z-index: 1; }
        .purple-glow-aura { position: absolute; top: -20vh; left: 10vw; width: 80vw; height: 50vh; background: radial-gradient(circle, rgba(111, 0, 255, 0.25) 0%, transparent 70%); filter: blur(60px); pointer-events: none; z-index: 2; }
        #cursor-glow { position: fixed; width: 150px; height: 150px; background: radial-gradient(circle, rgba(255, 102, 0, 0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; mix-blend-mode: screen; transition: width 0.2s, height 0.2s; }
        
        .sidebar { width: 240px; background-color: var(--sidebar-bg); border-right: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; padding: 24px 16px; z-index: 10; }
        .sidebar-logo { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 32px; display: flex; align-items: center; gap: 10px; }
        .sidebar-logo::before { content: ''; display: inline-block; width: 8px; height: 8px; background-color: var(--accent-orange); border-radius: 50%; box-shadow: 0 0 8px var(--accent-orange); }
        .nav-group { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
        .nav-item { display: flex; align-items: center; padding: 12px 14px; color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 0.95rem; font-weight: 500; transition: all 0.2s ease; cursor: pointer; }
        .nav-item:hover { color: var(--text-main); background-color: rgba(255, 102, 0, 0.08); padding-left: 18px; }
        .nav-item.active { color: var(--accent-orange); background-color: rgba(255, 102, 0, 0.12); font-weight: 600; }

        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; z-index: 10; position: relative; }
        .hub-center-container { width: 100%; max-width: 650px; text-align: center; }
        .site-title { font-size: 3.5rem; font-weight: 400; letter-spacing: -1px; margin-bottom: 24px; color: var(--text-main); }
        .search-wrapper { position: relative; width: 100%; }
        .search-bar { width: 100%; background-color: rgba(30, 30, 30, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); padding: 16px 20px; border-radius: 30px; color: var(--text-main); font-size: 1.1rem; outline: none; transition: all 0.3s ease; }
        .search-bar:focus { border-color: var(--accent-orange); box-shadow: 0 0 15px rgba(255, 102, 0, 0.25); }
    </style>
</head>
<body>

    <div class="checkered-overlay"></div>
    <div class="purple-glow-aura"></div>
    <div id="cursor-glow"></div>

    <aside class="sidebar">
        <div class="nav-group">
            <div class="sidebar-logo">Math Practice</div>
            <div class="nav-item active" onclick="location.reload()">Home Workspace</div>
            <div class="nav-item" onclick="launchProxy('https://desmos.com')">Graphing Utility</div>
            <div class="nav-item" onclick="launchProxy('https://geogebra.org')">Geometry Sandbox</div>
            <div class="nav-item" onclick="launchProxy('https://wikipedia.org')">Research Portal</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="hub-center-container" id="hub-center">
            <h1 class="site-title">math practice</h1>
            <div class="search-wrapper">
                <input type="text" class="search-bar" id="main-search" placeholder="Enter website link or search terms..." autocomplete="off">
            </div>
        </div>
    </main>

    <script>
        const searchInput = document.getElementById('main-search');
        const cursorGlow = document.getElementById('cursor-glow');

        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                var rawValue = searchInput.value.trim();
                if (!rawValue) return;

                if (!rawValue.startsWith('http://') && !rawValue.startsWith('https://')) {
                    if (rawValue.includes('.') && !rawValue.includes(' ')) {
                        rawValue = 'https://' + rawValue;
                    } else {
                        rawValue = 'https://google.com' + encodeURIComponent(rawValue);
                    }
                }
                launchProxy(rawValue);
            }
        });

        function launchProxy(targetWebUrl) {
            // FIXED PATH ROUTING: Connects directly to your verified active folder node 
            var finalDestination = "https://vercel.app" + btoa(targetWebUrl);
            window.location.replace(finalDestination);
        }
    </script>
</body>
</html>
